[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-dubbing"
version = "0.2.0"
description = "Local, adapter-driven dialogue synthesis and portable audio delivery"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "soundfile>=0.12,<1"]

[project.optional-dependencies]
qwen = ["qwen-tts==0.1.1"]

[project.scripts]
dub = "dubbing.cli:main"

[tool.setuptools.packages.find]
include = ["dubbing*"]
